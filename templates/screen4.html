<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>{{ test.title }} AI Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      html,
      body {
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        background: #111;
        overflow: hidden;
      }
      /* Accounts for modern iOS/Android gesture bars */
      .safe-bottom {
        padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
      }
      /* Fits video inside available space without pushing bottom controls out */
      .feed-fit {
        max-width: 100% !important;
        max-height: 100% !important;
        width: auto !important;
        height: auto !important;
        object-fit: contain !important;
      }
    </style>
  </head>
  <body
    class="bg-[#111] h-full h-[100dvh] flex flex-col font-mono select-none overflow-hidden justify-between"
  >
    {% if test.live_feed %}

    <!-- Video Feed Container: Flex-1 with min-h-0 forces image to scale within remaining space -->
    <div
      class="flex-1 relative flex items-center justify-center overflow-hidden w-full p-2 min-h-0 min-w-0"
    >
      <img
        id="ai-feed"
        class="hidden feed-fit mx-auto"
        alt="Live camera feed"
        onclick="onFeedClick(event, 'a')"
      />
      <img
        id="ai-feed-b"
        class="hidden feed-fit mx-auto"
        alt="Second camera feed"
        onclick="onFeedClick(event, 'b')"
      />

      <video id="cam-src" playsinline muted autoplay class="hidden"></video>
      <canvas id="cam-grab" class="hidden"></canvas>

      <div
        id="ai-feed-placeholder"
        class="absolute inset-0 flex flex-col items-center justify-center text-white/50 text-sm text-center gap-2 p-4"
      >
        <i class="fa-solid fa-video text-3xl sm:text-5xl"></i>
        <span>Tap START below to begin the live feed</span>
      </div>

      <div
        id="ai-status"
        class="hidden absolute top-2 left-2 right-2 bg-black/80 text-cyan-300 text-xs rounded-lg px-3 py-1.5 text-center backdrop-blur-sm z-40"
      ></div>

      <!-- Dedicated camera-switch status, kept separate from #ai-status so the
           engine's state poller (renderState) can't overwrite it. -->
      <div
        id="cam-status"
        class="hidden absolute top-12 left-2 right-2 bg-black/85 text-amber-300 text-xs rounded-lg px-3 py-1.5 text-center backdrop-blur-sm z-40"
      ></div>

      <button
        id="cam-flip-btn"
        onclick="flipCamera()"
        title="Switch front / back camera"
        class="hidden absolute top-2 right-2 z-50 bg-black/70 active:bg-black/90 text-white rounded-full w-10 h-10 flex items-center justify-center backdrop-blur-sm"
      >
        <i class="fa-solid fa-camera-rotate text-lg"></i>
      </button>

      <div
        id="ai-calib-overlay"
        class="hidden absolute bottom-2 left-0 right-0 flex flex-col items-center gap-2 px-4 z-40"
      >
        <div
          id="ai-calib-prompt"
          class="bg-black/90 text-white text-xs rounded-lg px-3 py-1 text-center"
        ></div>
        <div class="flex gap-2 w-full max-w-sm">
          <input
            id="ai-calib-input"
            type="number"
            inputmode="decimal"
            step="0.1"
            min="1"
            class="flex-1 rounded-lg px-3 py-1.5 text-black text-sm"
          />
          <button
            onclick="aiConfirmCm()"
            class="bg-indigo-500 active:bg-indigo-700 text-white text-xs font-bold px-4 py-1.5 rounded-lg whitespace-nowrap"
          >
            CONFIRM
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Control Panel: Locked strictly at the bottom with shrink-0 -->
    <div
      class="bg-black border-t border-white/10 px-3 py-2 safe-bottom flex flex-col gap-2 z-50 w-full shrink-0"
    >
      <div id="ai-action-row" class="hidden grid gap-1.5 w-full max-w-4xl mx-auto"></div>

      <div class="grid grid-cols-2 gap-2 max-w-4xl mx-auto w-full">
        <button
          id="engine-btn"
          onclick="launchEngine()"
          class="bg-emerald-500 active:bg-emerald-700 text-white font-bold py-2.5 sm:py-3.5 rounded-xl text-xs sm:text-base tracking-wide shadow-lg transition active:scale-95"
        >
          START
        </button>
        <button
          onclick="handleStopClick()"
          class="bg-rose-600 active:bg-rose-800 text-white font-bold py-2.5 sm:py-3.5 rounded-xl text-xs sm:text-base tracking-wide shadow-lg transition active:scale-95"
        >
          STOP / SAVE
        </button>
      </div>
    </div>

    {% else %}
    <div
      class="flex-1 flex flex-col items-center justify-center gap-4 px-6 text-white/50 text-sm text-center min-h-0"
    >
      <i class="fa-solid fa-person-running text-5xl"></i>
      AI test running in desktop window. Use the controls shown there.
    </div>
    <div
      class="bg-black border-t border-white/10 px-4 py-3 safe-bottom grid grid-cols-2 gap-3 max-w-4xl mx-auto w-full shrink-0 relative z-50"
    >
      <button
        id="engine-btn"
        onclick="launchEngine()"
        class="bg-emerald-500 active:bg-emerald-700 text-white font-bold py-3 sm:py-4 rounded-xl text-sm sm:text-base shadow-lg transition active:scale-95"
      >
        START
      </button>
      <button
        onclick="saveAndExit()"
        class="bg-rose-600 active:bg-rose-800 text-white font-bold py-3 sm:py-4 rounded-xl text-sm sm:text-base shadow-lg transition active:scale-95"
      >
        STOP / SAVE
      </button>
    </div>
    {% endif %}

    <script>
      const testId = {{ test.id|tojson }};
      const urlParams = new URLSearchParams(window.location.search);
      let runActive = false, engineStart = null;
      const sessionId = urlParams.get('session_id') ? parseInt(urlParams.get('session_id')) : null;

      // ── Per-test config for the generic live-feed panel ─────────────────
      const LIVE_ENGINES = {
          wingspan: {
              feedUrl:    '/api/wingspan/feed',
              stateUrl:   '/api/wingspan/state',
              actionUrl:  '/api/wingspan/action',
              browserCamera: true,
              frameUrl:   '/api/wingspan/frame',
              calibAction: 'enter_cm',
              calibPrompt: 'Spread both arms wide and hold still, then enter your real wingspan below',
              calibPlaceholder: 'Your wingspan in cm (e.g. 175)',
              buttons: [
                  { id: 'calibrate', label: 'CALIBRATE',     action: 'calibrate', color: 'bg-orange-600' },
                  { id: 'measure',   label: 'MEASURE',       action: 'measure',   color: 'bg-sky-600' },
                  { id: 'snapshot',  label: 'SNAPSHOT (3s)', action: 'snapshot',  color: 'bg-purple-600' },
              ],
              showCalibOverlay(state) { return state.phase === 'ENTER_CM'; },
              buttonDisabled(btnId, state) {
                  if (btnId === 'calibrate') return !state.running || state.mode === 'CALIBRATE';
                  if (btnId === 'measure')   return !state.running || state.mode === 'MEASURE';
                  if (btnId === 'snapshot') {
                      const armsOk = state.arms_ok === true;
                      return !state.running || state.mode !== 'MEASURE' || !state.calibrated
                             || state.snap_phase === 'COUNTING' || !armsOk;
                  }
                  return false;
              },
              renderStatus(state) {
                  const lines = [];
                  if (state.mode === 'CALIBRATE') {
                      lines.push(state.phase === 'ENTER_CM' ? 'Span locked — enter wingspan below' : 'Spread arms wide and hold still…');
                  } else {
                      lines.push(state.calibrated ? `Calibrated: ${state.calib_cm} cm` : 'Not calibrated — tap CALIBRATE');
                      if (state.snap_phase === 'COUNTING') lines.push('Hold still — measuring (3s)…');
                      else if (state.snap_phase === 'DONE' && state.snap_final_cm > 0) lines.push(`Snapshot: ${state.snap_final_cm} cm`);
                      else if (state.snap_phase === 'DONE') lines.push('Snapshot failed — arms not at 90°. Try again.');
                      else if (state.result_cm !== null && state.arms_ok) lines.push(`Live: ${state.result_cm} cm — arms OK, ready to snapshot`);
                      else if (state.result_cm !== null) lines.push(`Live: ${state.result_cm} cm — correct arm angle to 90° before snapshotting`);
                      else lines.push('Extend both arms to 90°, palms forward, fingers spread');
                  }
                  if (state.last_save !== null) lines.push(`Saved: ${state.last_save} cm`);
                  return lines;
              },
              syncFields(state) {
                  const v = (state.last_save != null) ? state.last_save
                          : (state.snap_final_cm > 0) ? state.snap_final_cm
                          : (state.result_cm != null && state.arms_ok) ? state.result_cm
                          : null;
                  return (v != null && v > 0) ? { wingspanScore: v } : null;
              },
          },
          bmi: {
              feedUrl:    '/api/bmi/feed',
              stateUrl:   '/api/bmi/state',
              actionUrl:  '/api/bmi/action',
              browserCamera: true,
              frameUrl:   '/api/bmi/frame',
              calibAction: 'calibrate',
              calibPrompt: 'Stand still, fully in frame, then enter your real height below',
              calibPlaceholder: 'Real height in cm (e.g. 175)',
              buttons: [
                  { id: 'scan',      label: 'SCAN (5s)',    action: 'scan',  color: 'bg-purple-600' },
                  { id: 'reset',     label: 'RESET CALIB',  action: 'reset', color: 'bg-rose-600' },
              ],
              showCalibOverlay(state) { return state.running && !!state.pose_detected; },
              buttonDisabled(btnId, state) {
                  if (btnId === 'scan')  return !state.running || state.scanning || !state.calibrated;
                  if (btnId === 'reset') return !state.running;
                  return false;
              },
              renderStatus(state) {
                  const lines = [];
                  lines.push(state.calibrated ? `Calibrated (${state.scale_factor} cm/px)` : 'Not calibrated — tap CALIBRATE');
                  if (state.pose_detected && !state.stable) lines.push('Hold still — settling…');
                  if (state.scanning) lines.push(`Scanning… ${state.scan_secs_left}s left`);
                  else if (state.smoothed_cm) lines.push(`Live: ${state.smoothed_cm} cm`);
                  else lines.push('Align full body in frame');
                  if (state.final_height_cm) lines.push(`Result: ${state.final_height_cm} cm`);
                  return lines;
              },
              syncFields(state) {
                  return state.final_height_cm ? { bmiScore: state.final_height_cm } : null;
              },
          },
          curl_up: {
              feedUrl:    '/api/curl_up/feed',
              stateUrl:   '/api/curl_up/state',
              actionUrl:  '/api/curl_up/action',
              browserCamera: true,
              frameUrl:   '/api/curl_up/frame',
              buttons: [
                  { id: 'start', label: 'START (30s)', action: 'start', color: 'bg-sky-600' },
                  { id: 'reset', label: 'RESET',        action: 'reset', color: 'bg-rose-600' },
              ],
              showCalibOverlay(state) { return false; },
              buttonDisabled(btnId, state) {
                  if (btnId === 'start') return !state.running || state.test_started;
                  return !state.running;
              },
              renderStatus(state) {
                  const lines = [`Count: ${state.count}`];
                  if (state.test_started && !state.test_done) lines.push(`${state.remaining_sec}s left`);
                  else if (state.test_done) lines.push('Done — tap STOP / SAVE');
                  else lines.push('Tap START to begin the 30s timer');
                  return lines;
              },
              syncFields(state) {
                  return (state.count !== null && state.count !== undefined) ? { curlUpScore: state.count } : null;
              },
          },
          pull_up: {
              feedUrl:    '/api/pull_up/feed',
              stateUrl:   '/api/pull_up/state',
              actionUrl:  '/api/pull_up/action',
              browserCamera: true,
              frameUrl:   '/api/pull_up/frame',
              buttons: [
                  { id: 'start', label: 'START', action: 'start', color: 'bg-sky-600' },
                  { id: 'reset', label: 'RESET', action: 'reset', color: 'bg-rose-600' },
              ],
              showCalibOverlay(state) { return false; },
              buttonDisabled(btnId, state) {
                  if (btnId === 'start') return !state.running || state.test_started;
                  return !state.running;
              },
              renderStatus(state) {
                  const lines = [`Count: ${state.count}`];
                  if (state.test_done) {
                      lines.push('Paused 2s — test ended. Tap STOP / SAVE');
                  } else if (state.test_started) {
                      lines.push(`${state.elapsed_sec}s elapsed`);
                      lines.push('Chin must reach the bar — ends after a 2s pause');
                  } else {
                      lines.push('Tap START as you call "GO"');
                  }
                  return lines;
              },
              syncFields(state) {
                  return (state.count !== null && state.count !== undefined) ? { pullUpScore: state.count } : null;
              },
          },
          full_pull_up: {
              feedUrl:    '/api/full_pull_up/feed',
              stateUrl:   '/api/full_pull_up/state',
              actionUrl:  '/api/full_pull_up/action',
              browserCamera: true,
              frameUrl:   '/api/full_pull_up/frame',
              buttons: [
                  { id: 'start', label: 'START', action: 'start', color: 'bg-sky-600' },
                  { id: 'reset', label: 'RESET', action: 'reset', color: 'bg-rose-600' },
              ],
              showCalibOverlay(state) { return false; },
              buttonDisabled(btnId, state) {
                  if (btnId === 'start') return !state.running || state.test_started;
                  return !state.running;
              },
              renderStatus(state) {
                  const lines = [`Count: ${state.count}`];
                  if (state.test_done) {
                      lines.push('Dropped off the bar — test ended. Tap STOP / SAVE');
                  } else if (state.test_started) {
                      lines.push(`${state.elapsed_sec}s elapsed`);
                      lines.push('Chin over the bar and shoulders above the elbows, then a full hang');
                  } else {
                      lines.push('Tap START as you call "GO"');
                  }
                  return lines;
              },
              syncFields(state) {
                  return (state.count !== null && state.count !== undefined) ? { fullPullUpScore: state.count } : null;
              },
          },
          wall_toss: {
              feedUrl:    '/api/wall_toss/feed',
              stateUrl:   '/api/wall_toss/state',
              actionUrl:  '/api/wall_toss/action',
              browserCamera: true,
              preferBackCamera: true,   // wall toss films the wall — default to the back camera on phones
              frameUrl:   '/api/wall_toss/frame',
              buttons: [
                  { id: 'start', label: 'START',  action: 'start',      color: 'bg-sky-600' },
                  { id: 'p1', label: 'ORANGE', action: 'set_preset', value: 1, color: 'bg-orange-600' },
                  { id: 'p2', label: 'YELLOW / TENNIS', action: 'set_preset', value: 2, color: 'bg-yellow-500' },
                  { id: 'p4', label: 'GREEN',  action: 'set_preset', value: 4, color: 'bg-emerald-600' },
                  { id: 'reset', label: 'RESET', action: 'reset',    color: 'bg-rose-600' },
              ],
              showCalibOverlay(state) { return false; },
              buttonDisabled(btnId, state) { return !state.running || state.active; },
              renderStatus(state) {
                  const lines = [`Tosses: ${state.toss_count}`, `Ball: ${state.ball_colour}`];
                  lines.push(state.status_msg || '');
                  return lines;
              },
              syncFields(state) {
                  return (state.toss_count !== null && state.toss_count !== undefined)
                      ? { wallTossScore: state.toss_count, ball_colour: state.ball_colour }
                      : null;
              },
          },
          sit_reach: {
              feedUrl:    '/api/sit_reach/feed',
              stateUrl:   '/api/sit_reach/state',
              actionUrl:  '/api/sit_reach/action',
              browserCamera: true,
              frameUrl:   '/api/sit_reach/frame',
              buttons: [
                  { id: 'mark',  label: 'MARK / LOCK', action: 'mark',  color: 'bg-sky-600' },
                  { id: 'reset', label: 'RESET',        action: 'reset', color: 'bg-rose-600' },
              ],
              showCalibOverlay(state) { return false; },
              buttonDisabled(btnId, state) {
                  if (btnId === 'mark') return !state.running || state.state === 'LOCKED';
                  return !state.running;
              },
              renderStatus(state) {
                  const lines = [`State: ${state.state}`];
                  if (state.disp_cm !== null) lines.push(`Reach: ${state.disp_cm} cm`);
                  return lines;
              },
              syncFields(state) {
                  return state.disp_cm !== null ? { sitReachScore: state.disp_cm } : null;
              },
          },
          trunk_lift: {
              feedUrl:    '/api/trunk_lift/feed',
              stateUrl:   '/api/trunk_lift/state',
              actionUrl:  '/api/trunk_lift/action',
              browserCamera: true,
              frameUrl:   '/api/trunk_lift/frame',
              // Calibration is two taps on the video itself (the ends of the
              // measuring stick), not a typed number — so clickCalibrate is on
              // and the enter-cm overlay stays hidden.
              clickCalibrate: true,
              buttons: [
                  { id: 'mark',    label: 'MARK',       action: 'mark',        color: 'bg-sky-600' },
                  { id: 'undo',    label: 'UNDO TRIAL', action: 'undo',        color: 'bg-amber-600' },
                  { id: 'recalib', label: 'RECALIBRATE', action: 'calib_reset', color: 'bg-orange-600' },
                  { id: 'reset',   label: 'RESET',      action: 'reset',       color: 'bg-rose-600' },
              ],
              showCalibOverlay(state) { return false; },
              buttonDisabled(btnId, state) {
                  if (!state.running) return true;
                  if (btnId === 'mark') return !state.calibrated || state.state === 'DONE';
                  if (btnId === 'undo') return !state.trials || state.trials.length === 0;
                  return false;
              },
              renderStatus(state) {
                  const lines = [];
                  if (!state.calibrated) {
                      const n = state.calib_points || 0;
                      lines.push(`Tap both ends of the ${state.stick_cm} cm measuring stick on the video (${n}/2)`);
                  } else {
                      lines.push(`Scale: ${state.px_per_cm} px/cm — floor line set`);
                      if (state.height_cm !== null && state.height_cm !== undefined) {
                          lines.push(`Chin: ${state.height_cm} cm (${state.height_in} in)` +
                                     (state.hold_pct > 0 ? `  — holding ${state.hold_pct}%` : ''));
                      } else {
                          lines.push(state.pose_detected ? 'Chin not visible — turn the head toward the camera'
                                                         : 'No participant detected');
                      }
                      const trials = state.trials || [];
                      lines.push(`Trials: ${trials.length ? trials.map(t => t + ' cm').join('  |  ') : '--'}` +
                                 `  (${trials.length}/${state.trials_required})`);
                      if (state.best_cm !== null && state.best_cm !== undefined) {
                          // The protocol records to the nearest cm, so show the
                          // measured value and the recorded one together — a best
                          // that matches neither trial otherwise looks like a bug.
                          const exact = state.best_exact_cm;
                          // A capped score says so on its own; showing
                          // "30.5 → records as 30" as well reads as rounding,
                          // which isn't what happened.
                          const rounds = (exact !== null && exact !== undefined
                                          && exact !== state.best_cm && !state.capped);
                          lines.push((rounds ? `Best: ${exact} cm → records as ${state.best_cm} cm`
                                             : `Best: ${state.best_cm} cm`) +
                                     ` (${state.best_in} in)` +
                                     (state.capped ? ' — capped at 12 in' : ''));
                      }
                  }
                  if (state.status_msg) lines.push(state.status_msg);
                  return lines;
              },
              syncFields(state) {
                  return (state.best_cm !== null && state.best_cm !== undefined)
                      ? { trunkLiftScore: state.best_cm }
                      : null;
              },
          },
          reverse_curl: {
              feedUrl:    '/api/reverse_curl/feed',
              stateUrl:   '/api/reverse_curl/state',
              actionUrl:  '/api/reverse_curl/action',
              browserCamera: true,
              frameUrl:   '/api/reverse_curl/frame',
              // The phone stands facing the seated participant, screen toward
              // the coach — the back camera. Falls back to whatever a laptop has.
              preferBackCamera: true,
              // Nothing to calibrate: the resting elbow angle is picked up
              // automatically once the participant sits still with the weight
              // on the thigh.
              // The camera decides everything — the verdict AND which arm is
              // working — so the only control is starting over.
              buttons: [
                  { id: 'reset', label: 'RESET', action: 'reset', color: 'bg-amber-600' },
              ],
              showCalibOverlay(state) { return false; },
              buttonDisabled(btnId, state) {
                  return !state.running;
              },
              renderStatus(state) {
                  const lines = [`State: ${state.state}`];
                  const armTxt = state.arm
                      ? `${state.arm}${state.arm_locked ? ' (locked)' : ''}`
                      : 'looking for the working arm';
                  lines.push(`Arm: ${armTxt}`);
                  if (state.angle_deg !== null && state.angle_deg !== undefined) {
                      const base = (state.baseline_deg !== null && state.baseline_deg !== undefined)
                          ? `, rest ${state.baseline_deg}\u00b0` : '';
                      lines.push(`Elbow: ${state.angle_deg}\u00b0 (target \u2264 ${state.target_angle_deg}\u00b0${base})`);
                  } else {
                      lines.push(state.pose_detected ? 'Arm not clearly visible \u2014 turn side-on to the camera'
                                                     : 'No participant detected');
                  }
                  lines.push(`Hold: ${state.hold_s} / ${state.required_hold_s} s` +
                             (state.hold_pct > 0 ? `  (${state.hold_pct}%)` : ''));
                  if (state.peak_angle_deg !== null && state.peak_angle_deg !== undefined) {
                      lines.push(`Best flexion: ${state.peak_angle_deg}\u00b0` +
                                 (state.attempts ? `  \u2014 ${state.attempts} attempt(s)` : ''));
                  }
                  if (state.resolved) {
                      lines.push(`RESULT: ${state.passed ? 'PASS' : 'FAIL'}`);
                  }
                  if (state.status_msg) lines.push(state.status_msg);
                  return lines;
              },
              syncFields(state) {
                  // Only a decided trial is synced. Exactly the BMI/Wingspan
                  // payload shape and nothing extra — those are the only tests
                  // confirmed to land on the dashboard. 1 = pass, 0 = fail.
                  return state.resolved
                      ? { reverseCurlScore: state.passed ? 1 : 0 }
                      : null;
              },
          },
          shoulder_stretch: {
              feedUrl:    '/api/shoulder_stretch/feed',
              stateUrl:   '/api/shoulder_stretch/state',
              actionUrl:  '/api/shoulder_stretch/action',
              browserCamera: true,
              frameUrl:   '/api/shoulder_stretch/frame',
              // The camera films the participant from BEHIND (the hands meet
              // between the shoulder blades), so on a phone this is the back
              // lens — which is also the un-mirrored one, and mirroring would
              // swap the RIGHT/LEFT trial label.
              preferBackCamera: true,
              // Nothing to calibrate: the fingertip gap is measured against the
              // participant's own palm length, so the threshold self-calibrates
              // per person and per distance from the camera.
              buttons: [
                  // No side buttons: BOTH sides must be banked inside one
                  // trial, so the arm is named per frame from the hands and
                  // pinning one side would make the other impossible.
                  { id: 'reset',  label: 'RESET',     action: 'reset', color: 'bg-amber-600' },
              ],
              showCalibOverlay(state) { return false; },
              buttonDisabled(btnId, state) {
                  // No PASS/FAIL button: the engine decides this test, and the
                  // coach confirms the staged verdict on the review screen.
                  return !state.running;
              },
              renderStatus(state) {
                  const lines = [`State: ${state.state}`];
                  // The engine locks onto the participant only while exactly one
                  // body is in frame; until then nothing is measured.
                  if (state.locked === false) lines.push('Only the student in frame to start');
                  // Both sides are needed, so show what is banked and what is
                  // left rather than one "current side".
                  const mark = (done) => done ? '\u2713 done' : 'to do';
                  lines.push(`Right: ${mark(state.right_done)}   Left: ${mark(state.left_done)}`);
                  lines.push(`Now: ${state.side ? state.side + ' arm over the shoulder'
                                                : 'working out which arm is over the shoulder'}`);
                  if (state.seconds_left !== null && state.seconds_left !== undefined) {

      function renderState(state) {
          if (!engineCfg) return;
          const box = document.getElementById('ai-status');
          const row = document.getElementById('ai-action-row');
          if (!box) return;
          if (!state.running) {
              if (state.error) {
                  box.classList.remove('hidden');
                  box.innerText = `Test stopped unexpectedly: ${state.error}`;
                  row.classList.add('hidden');
                  stopFeed_keepError();
              } else {
                  box.classList.add('hidden');
              }
              setButtonsEnabled(state);
              return;

          box.classList.remove('hidden');

      function stopFeed_keepError() {
          if (feedPollTimer) clearInterval(feedPollTimer);
          stopBrowserCamera();
          const img = document.getElementById('ai-feed');
          const imgB = document.getElementById('ai-feed-b');
          if (img) { img.src = ''; img.classList.add('hidden'); }
          if (imgB) { imgB.src = ''; imgB.classList.add('hidden'); }
          document.getElementById('ai-feed-placeholder')?.classList.remove('hidden');
          document.getElementById('ai-calib-overlay')?.classList.add('hidden');

      // ── Beeps (used by tests with an onState hook) ─────────────────────
      // Browsers only allow sound after the page has been tapped, so the
      // audio context is created on the first tap (START counts).
      let audioCtx = null;
      document.addEventListener('pointerdown', () => {
          try {
              if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              if (audioCtx.state === 'suspended') audioCtx.resume();
          } catch (e) {}
      });
      function beep(freq, seconds) {
          if (!audioCtx) return;
          try {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'square';          // carries on a phone speaker
              osc.frequency.value = freq;
              const t = audioCtx.currentTime;
              gain.gain.setValueAtTime(0.25, t);
              gain.gain.setValueAtTime(0.25, t + seconds - 0.03);
              gain.gain.linearRampToValueAtTime(0, t + seconds);
              osc.connect(gain).connect(audioCtx.destination);
              osc.start(t);
              osc.stop(t + seconds);
          } catch (e) {}
      }

      // ── Browser camera → server ──────────────────────────────────────
      let camStream = null;
      let camTimer  = null;

      // 'user' = front, 'environment' = back (phones). Tests with
      // preferBackCamera (e.g. wall toss, which films the wall) open the back
      // camera by default; facingMode is a soft preference, so a laptop with
      // only a front camera just uses that. The flip button still toggles it.
      let camFacing = (engineCfg && engineCfg.preferBackCamera) ? 'environment' : 'user';
      let currentDeviceId = null;   // deviceId of the camera currently streaming
      const CAM_FPS = 20;

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // state poller rewrites #ai-status every tick, which used to wipe any
      // flip error before it could be read.
      let camStatusTimer = null;
      function camStatus(msg, autoHideMs) {
          const box = document.getElementById('cam-status');
          if (!box) return;
          if (camStatusTimer) { clearTimeout(camStatusTimer); camStatusTimer = null; }
          box.innerText = msg;
          box.classList.remove('hidden');
          if (autoHideMs) camStatusTimer = setTimeout(() => box.classList.add('hidden'), autoHideMs);
      }
      function camStatusClear() {
          const box = document.getElementById('cam-status');
          if (camStatusTimer) { clearTimeout(camStatusTimer); camStatusTimer = null; }
          if (box) box.classList.add('hidden');
      }

      // Guess which way a camera faces from its device label. Android labels the
      // lenses e.g. "camera2 0, facing back" / "front camera".
      function guessFacingFromLabel(label) {
          const l = (label || '').toLowerCase();
          if (l.includes('back') || l.includes('rear') || l.includes('environment')) return 'environment';
          if (l.includes('front') || l.includes('user') || l.includes('face'))       return 'user';
          return null;
      }

      async function listVideoInputs() {
          try {
              const devices = await navigator.mediaDevices.enumerateDevices();
              return devices.filter((d) => d.kind === 'videoinput');
          } catch (e) { return []; }
      }

      // Resolve once the <video> is really PLAYING frames, or bail out after a
      // timeout. Metadata (loadedmetadata) fires even while the element is
      // paused — and a paused video reports a non-zero videoWidth — so on
      // Android the old check thought a stalled/paused stream was "ready" and
      // the feed froze on one frame. requestVideoFrameCallback only fires when a
      // frame is actually presented, which is the true "frames are flowing"
      // signal; we fall back to the playing/timeout checks where it's absent.
      function waitForVideoReady(video, timeoutMs = 5000) {
          return new Promise((resolve) => {
              let done = false;
              const cleanup = () => {
                  video.removeEventListener('loadedmetadata', onReady);
                  video.removeEventListener('playing', onReady);
              };
              const finish = (ok) => {
                  if (done) return;
                  done = true;
                  cleanup();
                  resolve(ok);
              };
              const onReady = () => { if (video.videoWidth > 0 && !video.paused) finish(true); };
              if (video.videoWidth > 0 && !video.paused) return finish(true);
              video.addEventListener('loadedmetadata', onReady);
              video.addEventListener('playing', onReady);
              if (typeof video.requestVideoFrameCallback === 'function') {
                  try { video.requestVideoFrameCallback(() => finish(true)); } catch (e) {}
              }
              // Last resort: accept a stream that at least has dimensions, so a
              // browser without rVFC that never fires 'playing' still proceeds.
              setTimeout(() => finish(video.videoWidth > 0), timeoutMs);
          });
      }

      // Open a camera, most-reliable method first. On Android Chrome
      // facingMode:{exact} is flaky, so when we know the target lens's deviceId
      // we open THAT directly; otherwise fall back to exact facing, then soft
      // facing, then any camera. Throws the last error if every attempt fails.
      async function openCameraStream(targetDeviceId) {
          const base = { width: { ideal: 640 }, height: { ideal: 480 } };
          const attempts = [];
          if (targetDeviceId) attempts.push({ ...base, deviceId: { exact: targetDeviceId } });
          attempts.push({ ...base, facingMode: { exact: camFacing } });
          attempts.push({ ...base, facingMode: camFacing });
          attempts.push({ ...base });   // last resort: whatever camera exists
          let lastErr = null;
          for (const v of attempts) {
              try {
                  return await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
              } catch (e) { lastErr = e; }
          }
          throw lastErr || new Error('No camera available');
      }

      async function startBrowserCamera(targetDeviceId) {
          if (!engineCfg || !engineCfg.browserCamera) return { ok: true };
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
              return { ok: false, error: 'This browser blocks camera access (needs HTTPS + a modern browser).' };
          }
          const video  = document.getElementById('cam-src');
          const canvas = document.getElementById('cam-grab');
          try {
              camStream = await openCameraStream(targetDeviceId);
          } catch (err) {
              const name = (err && err.name) ? err.name : String(err);
              const msg  = (err && err.message) ? err.message : '';
              return { ok: false, error: `Camera open failed: ${name}${msg ? ' — ' + msg : ''}` };
          }
          video.srcObject = camStream;
          // Android Chrome: assigning a new srcObject interrupts the previous
          // play() and can leave the element PAUSED (its play() promise rejects
          // with AbortError). A paused video still reports a videoWidth, so the
          // grab loop would redraw one frozen frame forever. Force it to play,
          // retrying once after a beat, and keep the attributes autoplay needs.
          video.muted = true;
          video.playsInline = true;
          try {
              await video.play();
          } catch (e) {
              await sleep(120);
              try { await video.play(); } catch (e2) {}
          }
          // Verify the stream actually produced frames. On Android the back cam
          // can "open" right after the front lens releases but never deliver a
          // frame (videoWidth stays 0, or it stays paused) — that must be treated
          // as a FAILURE, or the send loop's videoWidth guard silently blocks
          // every POST and the MJPEG feed freezes with no error.
          let ready = await waitForVideoReady(video);
          if (ready && video.paused) {
              // Ready dimensions but not advancing — one more play() nudge.
              try { await video.play(); } catch (e) {}
              ready = !video.paused;
          }
          if (!ready) {
              try { camStream.getTracks().forEach((t) => t.stop()); } catch (e) {}
              camStream = null;
              video.srcObject = null;
              return { ok: false, error: 'Camera opened but delivered no video — try flipping again.' };
          }
          // Record which physical lens we actually got, and work out which way
          // it faces so the server mirrors correctly. Phones report facingMode;
          // most laptop/desktop webcams report nothing. A lens that doesn't say
          // is judged by its label, and failing that is treated as FRONT: every
          // phone identifies its back camera, so an unidentified lens is a
          // webcam looking at the participant. Without this, tests that prefer
          // the back camera (wall toss, reverse curl) kept that preference on a
          // laptop and showed a photo-style, un-mirrored preview.
          try {
              const track = camStream.getVideoTracks()[0];
              const st = track.getSettings();
              if (st.deviceId) currentDeviceId = st.deviceId;
              if (st.facingMode === 'user' || st.facingMode === 'environment') {
                  camFacing = st.facingMode;
              } else {
                  camFacing = guessFacingFromLabel(track.label) || 'user';
              }
          } catch (e) {}
          maybeShowFlipButton();
          const ctx = canvas.getContext('2d');
          camTimer = setInterval(() => {
              if (camSending || !video.videoWidth) return;
              canvas.width  = video.videoWidth;
              canvas.height = video.videoHeight;
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              canvas.toBlob((blob) => {
                  if (!blob || !engineCfg) return;
                  camSending = true;
                  // Tell the server which camera this frame came from so it
                  // only selfie-mirrors the front cam, not the back cam.
                  const frameUrl = `${engineCfg.frameUrl}?facing=${encodeURIComponent(camFacing)}`;
                  fetch(frameUrl, { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob })
                      .catch(() => {})
                      .finally(() => { camSending = false; });
              }, 'image/jpeg', 0.6);
          }, Math.round(1000 / CAM_FPS));
          return { ok: true };
      }

      function stopBrowserCamera() {
          if (camTimer) { clearInterval(camTimer); camTimer = null; }
          if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
          const video = document.getElementById('cam-src');
          if (video) {
              try { video.pause(); } catch (e) {}
              video.srcObject = null;
              // Android Chrome can keep the last decoded frame from the JUST-
              // STOPPED stream painted on this <video> element — srcObject=null
              // alone doesn't clear the compositor's last frame. load() forces
              // a real reset, so the next startBrowserCamera() can't silently
              // inherit a stale frozen frame that would otherwise get drawn to
              // the canvas and shipped to the server as if it were new video.
              try { video.load(); } catch (e) {}
          }
          camSending = false;
          document.getElementById('cam-flip-btn')?.classList.add('hidden');
      }

      // Show the flip button only when this device actually has more than one
      // camera (i.e. phones) — a single-webcam laptop has nothing to flip to.
      async function maybeShowFlipButton() {
          const btn = document.getElementById('cam-flip-btn');
          if (!btn) return;
          try {
              const devices = await navigator.mediaDevices.enumerateDevices();
              const cams = devices.filter(d => d.kind === 'videoinput');
              btn.classList.toggle('hidden', cams.length < 2);
          } catch (e) {
              btn.classList.add('hidden');
          }
      }

      // Toggle front/back and restart only the capture (the server feed keeps
      // running). On mobile the camera hardware needs a moment to release after
      // the old stream stops, so we stop, wait, then open the other lens — and
      // fall back to the previous camera if the new one won't open.
      let camFlipping = false;
      async function flipCamera() {
          if (!camStream || camFlipping) return;
          camFlipping = true;
          const btn = document.getElementById('cam-flip-btn');
          if (btn) btn.disabled = true;
          camStatus('Switching camera…');

          const prevFacing   = camFacing;
          const prevDeviceId = currentDeviceId;
          const wantFacing   = (camFacing === 'user') ? 'environment' : 'user';

          // Pick the target lens BY deviceId while the current stream is still
          // live (labels are only populated once permission is granted). Prefer
          // a device whose label matches the wanted facing; otherwise cycle to
          // the next different camera.
          let targetId = null;
          const cams = await listVideoInputs();
          if (cams.length >= 2) {
              const match = cams.find((c) => guessFacingFromLabel(c.label) === wantFacing);
              if (match) {
                  targetId = match.deviceId;
              } else {
                  const idx  = cams.findIndex((c) => c.deviceId === currentDeviceId);
                  const next = cams[(idx + 1) % cams.length];
                  if (next && next.deviceId !== currentDeviceId) targetId = next.deviceId;
              }
          }
          // Best guess of the target's facing (server mirror); corrected from the
          // real track settings inside startBrowserCamera once it's open.
          const chosen = targetId ? cams.find((c) => c.deviceId === targetId) : null;
          camFacing = (chosen && guessFacingFromLabel(chosen.label)) || wantFacing;

          stopBrowserCamera();
          await sleep(400);                    // let the lens hardware release
          let res = await startBrowserCamera(targetId);

          if (res.ok) {
              camStatusClear();
          } else {
              // Surface the ACTUAL getUserMedia failure so the failing call is
              // visible (in its own box the poller can't overwrite)…
              camStatus('Flip failed: ' + (res.error || 'unknown'));
              // …then fall back to the camera that was working.
              camFacing = prevFacing;
              await sleep(400);
              const back = await startBrowserCamera(prevDeviceId);
              if (!back.ok) {
                  camStatus('Flip failed: ' + (res.error || 'unknown') +
                            ' | revert failed: ' + (back.error || 'unknown'));
              } else {
                  camStatus('Could not switch — kept the current camera. (' +
                            (res.error || 'unknown') + ')', 6000);
              }
          }

          if (btn) btn.disabled = false;
          camFlipping = false;
      }

      function startFeed() {
          if (!engineCfg) return;
          document.getElementById('ai-feed-placeholder')?.classList.add('hidden');
          const img = document.getElementById('ai-feed');
          const imgB = document.getElementById('ai-feed-b');
          if (img) {
              img.classList.remove('hidden');
              img.src = `${engineCfg.feedUrl}?t=${Date.now()}`;
          }
          if (imgB) {
              if (engineCfg.dualFeed && engineCfg.feedUrlB) {
                  imgB.classList.remove('hidden');
                  imgB.src = `${engineCfg.feedUrlB}?t=${Date.now()}`;
              } else {
                  imgB.classList.add('hidden');
                  imgB.src = '';
              }
          }
          feedPollTimer = setInterval(pollState, 600);
          pollState();
      }

      function stopFeed() {
          if (feedPollTimer) clearInterval(feedPollTimer);
          stopBrowserCamera();
          const img = document.getElementById('ai-feed');
          const imgB = document.getElementById('ai-feed-b');
          if (img) { img.src = ''; img.classList.add('hidden'); }
          if (imgB) { imgB.src = ''; imgB.classList.add('hidden'); }
          document.getElementById('ai-feed-placeholder')?.classList.remove('hidden');
          document.getElementById('ai-calib-overlay')?.classList.add('hidden');
          document.getElementById('ai-status')?.classList.add('hidden');
          document.getElementById('ai-action-row')?.classList.add('hidden');
          camStatusClear();
      }

      async function aiAction(action, value) {
          if (!engineCfg) return;
          const res = await fetch(engineCfg.actionUrl, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action, value })
          });
          const data = await res.json();
          const box = document.getElementById('ai-status');
          if (!data.ok && data.error && box) { box.innerText = data.error; box.classList.remove('hidden'); }
          pollState();
      }

      function onFeedClick(evt, cam) {
          if (!engineCfg || !engineCfg.clickCalibrate || !runActive) return;
          const img = evt.currentTarget;
          const rect = img.getBoundingClientRect();
          const scaleX = img.naturalWidth / rect.width;
          const scaleY = img.naturalHeight / rect.height;
          const x = Math.round((evt.clientX - rect.left) * scaleX);
          const y = Math.round((evt.clientY - rect.top) * scaleY);
          aiAction('calib_click', { cam, x, y });
      }

      function aiConfirmCm() {
          if (!engineCfg) return;
          const v = parseFloat(document.getElementById('ai-calib-input').value);
          if (!v || v <= 0) return;
          aiAction(engineCfg.calibAction, v);
          document.getElementById('ai-calib-input').value = '';
      }

      async function launchEngine() {
          const btn = document.getElementById('engine-btn');
          btn.disabled = true; btn.innerText = '…';
          const body = {};
          {% for param in test.params %}
          body[{{ param.name|tojson }}] = urlParams.get({{ param.name|tojson }});
          {% endfor %}
          if (sessionId) body['session_id'] = sessionId;
          
          try {
              const res = await fetch(`/api/launch/${testId}`, {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(body)
              });
              const data = await res.json();
              if (data.ok) {
                  btn.innerText = '● RUNNING';
                  btn.classList.replace('bg-emerald-500', 'bg-emerald-800');
                  runActive = true; engineStart = Date.now();
                  if (engineCfg) {
                      startFeed();
                      const cam = await startBrowserCamera();
                      if (!cam.ok) {
                          runActive = false;
                          stopFeed();
                          try { await fetch(`/api/stop/${testId}`, { method: 'POST' }); } catch (e) {}
                          const box = document.getElementById('ai-status');
                          if (box) { box.classList.remove('hidden'); box.innerText = cam.error; }
                          btn.disabled = false; btn.innerText = 'START';
                          btn.classList.replace('bg-emerald-800', 'bg-emerald-500');
                      }
                  }
              } else {
                  btn.disabled = false; btn.innerText = 'START';
                  const box = document.getElementById('ai-status');
                  if (box) { box.innerText = data.error || 'Failed to start engine'; box.classList.remove('hidden'); }
              }
          } catch(err) {
              btn.disabled = false; btn.innerText = 'START';
              console.error("Launch error:", err);
          }
      }

      async function saveAndExit() { 
          if (runActive) { runActive = false; }
          if (engineCfg) stopFeed();
          try { await fetch(`/api/stop/${testId}`, { method: 'POST' }); } catch(e) {}
      }

      async function handleStopClick() {
          if (runActive) { runActive = false; }
          if (engineCfg) stopFeed();
          try { await fetch(`/api/stop/${testId}`, { method: 'POST' }); }
          catch (e) { console.error('Stop system error:', e); }

          if (engineCfg && engineCfg.stateUrl) {
              try {
                  const fresh = await fetch(engineCfg.stateUrl).then(r => r.json());
                  if (fresh) latestState = fresh;
              } catch (e) {}
          }

          const fields = (engineCfg && engineCfg.syncFields && latestState)
              ? engineCfg.syncFields(latestState)
              : null;

          console.log("Calculated sync payload:", fields);

          const EXERCISE_TYPE = {
              wingspan:'Wingspan', bmi:'BMI', curl_up:'CurlUp', pull_up:'PullUp', full_pull_up:'FullPullUp',
              wall_toss:'WallToss', sit_reach:'SitReach', trunk_lift:'TrunkLift',
              reverse_curl:'ReverseCurl',
              shoulder_stretch:'ShoulderStretch',
              isometric_push_up:'IsometricPushUp',
              seated_push_up:'SeatedPushUp',
              vertical_jump:'VerticalJump', shuttle_run:'ShuttleRun',
              dash_50m:'Dash50m', run_600m:'Run600m',
          };

          if (fields && window.opener) {
              window.opener.postMessage({
                  type: 'AI_SYNC_DATA',
                  exerciseType: EXERCISE_TYPE[testId] || testId,
                  testId,
                  sessionId,
                  ...fields,
              }, 'https://nep.goforfit.in');

              setTimeout(() => { window.close(); }, 500);
          } else if (fields && !window.opener) {
              console.warn('No window.opener — page not opened by Laravel, skipping sync.');
          } else if (!fields) {
              console.warn(`No result available yet for '${testId}' — skipping Laravel sync.`);
          }

          saveAndExit();
      }

      if (engineCfg) buildActionRow();
    </script>
  </body>
