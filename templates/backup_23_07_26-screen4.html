<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ test.title }} AI Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #111;
        overflow: hidden;
      }
    </style>
  </head>
  <body
    class="bg-[#111] h-screen flex flex-col font-mono select-none overflow-hidden"
  >
    {% if test.live_feed %}

    <div
      class="flex-1 relative flex items-center justify-center overflow-hidden"
      style="min-height: 0"
    >
      <img
        id="ai-feed"
        class="hidden w-1/2 h-full object-contain"
        alt="Live camera feed"
        style="max-height: 100%"
        onclick="onFeedClick(event, 'a')"
      />
      <img
        id="ai-feed-b"
        class="hidden w-1/2 h-full object-contain"
        alt="Second camera feed"
        style="max-height: 100%"
        onclick="onFeedClick(event, 'b')"
      />
      <!--
        Hidden browser-camera capture pipeline (server-processes-frames model).
        getUserMedia streams the phone/laptop camera into <video>; each frame
        is drawn to <canvas>, encoded to JPEG and POSTed to the engine. The
        VISIBLE feed above (#ai-feed) is the annotated result the server
        streams back — this pair never shows on screen.
      -->
      <video id="cam-src" playsinline muted autoplay class="hidden"></video>
      <canvas id="cam-grab" class="hidden"></canvas>
      <div
        id="ai-feed-placeholder"
        class="absolute inset-0 flex flex-col items-center justify-center text-white/50 text-sm text-center gap-3"
      >
        <i class="fa-solid fa-video text-5xl"></i>
        <span>Tap START below to begin the live feed</span>
      </div>
      <div
        id="ai-status"
        class="hidden absolute top-3 left-3 right-3 bg-black/70 text-cyan-300 text-xs rounded-lg px-4 py-2 text-center backdrop-blur-sm"
      ></div>

      <div
        id="ai-calib-overlay"
        class="hidden absolute bottom-4 left-0 right-0 flex flex-col items-center gap-2 px-4"
      >
        <div
          id="ai-calib-prompt"
          class="bg-black/80 text-white text-xs rounded-lg px-4 py-2 text-center"
        ></div>
        <div class="flex gap-2 w-full max-w-sm">
          <input
            id="ai-calib-input"
            type="number"
            inputmode="decimal"
            step="0.1"
            min="1"
            class="flex-1 rounded-lg px-3 py-2 text-black text-sm"
          />
          <button
            onclick="aiConfirmCm()"
            class="bg-indigo-500 active:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-lg whitespace-nowrap"
          >
            CONFIRM
          </button>
        </div>
      </div>
    </div>

    <div
      class="bg-black border-t border-white/10 px-4 py-3 flex flex-col gap-2"
    >
      <div id="ai-action-row" class="hidden grid gap-2"></div>

      <div class="grid grid-cols-2 gap-3">
        <button
          id="engine-btn"
          onclick="launchEngine()"
          class="bg-emerald-500 active:bg-emerald-700 text-white font-bold py-5 rounded-xl text-base tracking-wide shadow-lg"
        >
          START
        </button>
        <button
          onclick="handleStopClick()"
          class="bg-rose-600 active:bg-rose-800 text-white font-bold py-5 rounded-xl text-base tracking-wide shadow-lg"
        >
          STOP / SAVE
        </button>
      </div>
    </div>

    {% else %}
    <div
      class="flex-grow flex flex-col items-center justify-center gap-4 px-6 text-white/50 text-sm text-center"
    >
      <i class="fa-solid fa-person-running text-5xl"></i>
      AI test running in desktop window. Use the controls shown there.
    </div>
    <div
      class="bg-black border-t border-white/10 px-4 py-3 grid grid-cols-2 gap-3"
    >
      <button
        id="engine-btn"
        onclick="launchEngine()"
        class="bg-emerald-500 text-white font-bold py-5 rounded-xl text-base shadow-lg"
      >
        START
      </button>
      <button
        onclick="saveAndExit()"
        class="bg-rose-600 text-white font-bold py-5 rounded-xl text-base shadow-lg"
      >
        STOP / SAVE
      </button>
    </div>
    {% endif %}

    <script>
            const testId = {{ test.id|tojson }};
            const urlParams = new URLSearchParams(window.location.search);
            let runActive = false, engineStart = null;
            const sessionId = urlParams.get('session_id') ? parseInt(urlParams.get('session_id')) : null;

            // ── Per-test config for the generic live-feed panel ─────────────────
            // To bring a NEW AI test into the browser (instead of a desktop
            // window): add "live_feed": True to its TESTS entry in app.py, build
            // its engine + /api/<test>/feed|state|action endpoints the same way
            // wingspan/vertical_jump did, then add one entry here describing its
            // buttons and how to read its state. No template changes needed.
            const LIVE_ENGINES = {
                wingspan: {
                    feedUrl:   '/api/wingspan/feed',
                    stateUrl:  '/api/wingspan/state',
                    actionUrl: '/api/wingspan/action',
                    // Camera comes from THIS browser, not the server: capture
                    // frames locally and POST them to frameUrl for processing.
                    browserCamera: true,
                    frameUrl:  '/api/wingspan/frame',
                    calibAction: 'enter_cm',
                    calibPrompt: 'Spread both arms wide and hold still, then enter your real wingspan below',
                    calibPlaceholder: 'Your wingspan in cm (e.g. 175)',
                    buttons: [
                        { id: 'calibrate', label: 'CALIBRATE',     action: 'calibrate', color: 'bg-orange-600' },
                        { id: 'measure',   label: 'MEASURE',       action: 'measure',   color: 'bg-sky-600' },
                        { id: 'snapshot',  label: 'SNAPSHOT (3s)', action: 'snapshot',  color: 'bg-purple-600' },
                    ],
                    showCalibOverlay(state) { return state.phase === 'ENTER_CM'; },
                    buttonDisabled(btnId, state) {
                        if (btnId === 'calibrate') return !state.running || state.mode === 'CALIBRATE';
                        if (btnId === 'measure')   return !state.running || state.mode === 'MEASURE';
                        if (btnId === 'snapshot') {
                            const armsOk = state.arms_ok === true;
                            return !state.running || state.mode !== 'MEASURE' || !state.calibrated
                                   || state.snap_phase === 'COUNTING' || !armsOk;
                        }
                        return false;
                    },
                    renderStatus(state) {
                        const lines = [];
                        if (state.mode === 'CALIBRATE') {
                            lines.push(state.phase === 'ENTER_CM' ? 'Span locked — enter wingspan below' : 'Spread arms wide and hold still…');
                        } else {
                            lines.push(state.calibrated ? `Calibrated: ${state.calib_cm} cm` : 'Not calibrated — tap CALIBRATE');
                            if (state.snap_phase === 'COUNTING') lines.push('Hold still — measuring (3s)…');
                            else if (state.snap_phase === 'DONE' && state.snap_final_cm > 0) lines.push(`Snapshot: ${state.snap_final_cm} cm`);
                            else if (state.snap_phase === 'DONE') lines.push('Snapshot failed — arms not at 90°. Try again.');
                            else if (state.result_cm !== null && state.arms_ok) lines.push(`Live: ${state.result_cm} cm — arms OK, ready to snapshot`);
                            else if (state.result_cm !== null) lines.push(`Live: ${state.result_cm} cm — correct arm angle to 90° before snapshotting`);
                            else lines.push('Extend both arms to 90°, palms forward, fingers spread');
                        }
                        if (state.last_save !== null) lines.push(`Saved: ${state.last_save} cm`);
                        return lines;
                    },
                    // Wingspan bypasses screen3 and syncs straight back to the Laravel
                    // parent window on STOP/SAVE — everything else goes through the
                    // normal screen3 review/save flow (saveAndExit()).// TODO: confirm exact Laravel field name with integration owner
                    syncFields(state) {
                        // The measured value moves from snap_final_cm into
                        // last_save the moment SAVE READING is tapped (the
                        // engine clears snap afterwards). Reading only
                        // snap_final_cm therefore synced null for any properly
                        // saved reading. Prefer last_save; fall back to a
                        // completed-but-unsaved snapshot, then a live reading.
                        const v = (state.last_save != null) ? state.last_save
                                : (state.snap_final_cm > 0) ? state.snap_final_cm
                                : (state.result_cm != null && state.arms_ok) ? state.result_cm
                                : null;
                        return (v != null && v > 0) ? { wingspanScore: v } : null;
                    },
                },
                bmi: {
                    feedUrl:   '/api/bmi/feed',
                    stateUrl:  '/api/bmi/state',
                    actionUrl: '/api/bmi/action',
                    browserCamera: true,
                    frameUrl:  '/api/bmi/frame',
                    calibAction: 'calibrate',
                    calibPrompt: 'Stand still, fully in frame, then enter your real height below',
                    calibPlaceholder: 'Real height in cm (e.g. 175)',
                    buttons: [
                        { id: 'scan',      label: 'SCAN (5s)',  action: 'scan',      color: 'bg-purple-600' },
                        { id: 'calibrate', label: 'CALIBRATE',  action: 'calibrate', color: 'bg-orange-600' },
                    ],
                    showCalibOverlay(state) { return false; },
                    buttonDisabled(btnId, state) {
                        if (btnId === 'scan') return !state.running || state.scanning;
                        if (btnId === 'calibrate') return !state.running || !state.smoothed_cm;
                        return false;
                    },
                    renderStatus(state) {
                        const lines = [];
                        lines.push(state.calibrated ? `Calibrated x${state.scale_factor}` : 'Not calibrated — tap CALIBRATE');
                        if (state.scanning) lines.push(`Scanning… ${state.scan_secs_left}s left`);
                        else if (state.smoothed_cm) lines.push(`Live: ${state.smoothed_cm} cm`);
                        else lines.push('Align full body in frame');
                        if (state.final_height_cm) lines.push(`Result: ${state.final_height_cm} cm`);
                        return lines;
                    },
                    syncFields(state) {
                        return state.final_height_cm ? { height_cm: state.final_height_cm } : null;
                    },
                },

                curl_up: {
                    feedUrl:   '/api/curl_up/feed',
                    stateUrl:  '/api/curl_up/state',
                    actionUrl: '/api/curl_up/action',
                    browserCamera: true,
                    frameUrl:  '/api/curl_up/frame',
                    buttons: [
                        { id: 'start', label: 'START (30s)', action: 'start', color: 'bg-sky-600' },
                        { id: 'reset', label: 'RESET',       action: 'reset', color: 'bg-rose-600' },
                    ],
                    showCalibOverlay(state) { return false; },
                    buttonDisabled(btnId, state) {
                        if (btnId === 'start') return !state.running || state.test_started;
                        return !state.running;
                    },
                    renderStatus(state) {
                        const lines = [`Count: ${state.count}`];
                        if (state.test_started && !state.test_done) lines.push(`${state.remaining_sec}s left`);
                        else if (state.test_done) lines.push('Done — tap STOP / SAVE');
                        else lines.push('Tap START to begin the 30s timer');
                        return lines;
                    },
                    // TODO: confirm exact Laravel field name with integration owner
                    syncFields(state) {
                        return (state.count !== null && state.count !== undefined) ? { reps: state.count } : null;
                    },
                },

                wall_toss: {
                    feedUrl:   '/api/wall_toss/feed',
                    stateUrl:  '/api/wall_toss/state',
                    actionUrl: '/api/wall_toss/action',
                    browserCamera: true,
                    frameUrl:  '/api/wall_toss/frame',
                    buttons: [
                        { id: 'start', label: 'START',  action: 'start',      color: 'bg-sky-600' },
                        { id: 'p1', label: 'ORANGE', action: 'set_preset', value: 1, color: 'bg-orange-600' },
                        { id: 'p4', label: 'GREEN',  action: 'set_preset', value: 4, color: 'bg-emerald-600' },
                        { id: 'reset', label: 'RESET', action: 'reset',    color: 'bg-rose-600' },
                    ],
                    showCalibOverlay(state) { return false; },
                    buttonDisabled(btnId, state) { return !state.running || state.active; },
                    renderStatus(state) {
                        const lines = [`Tosses: ${state.toss_count}`, `Ball: ${state.ball_colour}`];
                        lines.push(state.status_msg || '');
                        return lines;
                    },
                    // TODO: confirm exact Laravel field name(s) with integration owner
                    syncFields(state) {
                        return (state.toss_count !== null && state.toss_count !== undefined)
                            ? { catches: state.toss_count, ball_colour: state.ball_colour }
                            : null;
                    },
                },
                sit_reach: {
                    feedUrl:   '/api/sit_reach/feed',
                    stateUrl:  '/api/sit_reach/state',
                    actionUrl: '/api/sit_reach/action',
                    browserCamera: true,
                    frameUrl:  '/api/sit_reach/frame',
                    buttons: [
                        { id: 'mark',  label: 'MARK / LOCK', action: 'mark',  color: 'bg-sky-600' },
                        { id: 'reset', label: 'RESET',        action: 'reset', color: 'bg-rose-600' },
                    ],
                    showCalibOverlay(state) { return false; },
                    buttonDisabled(btnId, state) {
                        if (btnId === 'mark') return !state.running || state.state === 'LOCKED';
                        return !state.running;
                    },
                    renderStatus(state) {
                        const lines = [`State: ${state.state}`];
                        if (state.disp_cm !== null) lines.push(`Reach: ${state.disp_cm} cm`);
                        return lines;
                    },
                    // TODO: confirm exact Laravel field name with integration owner
                    syncFields(state) {
                        return state.disp_cm !== null ? { reach_cm: state.disp_cm } : null;
                    },
                },
                vertical_jump: {
                    feedUrl:   '/api/vertical_jump/feed',
                    stateUrl:  '/api/vertical_jump/state',
                    actionUrl: '/api/vertical_jump/action',
                    browserCamera: true,
                    frameUrl:  '/api/vertical_jump/frame',
                    calibAction: 'calibrate',
                    calibPrompt: 'Stand tall, reach straight up, hold still — then enter your real standing reach below',
                    calibPlaceholder: 'Standing reach in cm (e.g. 198)',
                    buttons: [
                        { id: 'capture_baseline', label: 'CAPTURE BASELINE', action: 'capture_baseline', color: 'bg-orange-600' },
                        { id: 'start_attempt',    label: 'START ATTEMPT',    action: 'start_attempt',    color: 'bg-sky-600' },
                    ],
                    showCalibOverlay(state) { return state.baseline_captured && !state.calibrated; },
                    buttonDisabled(btnId, state) {
                        if (btnId === 'capture_baseline') return !state.running || state.capturing_baseline;
                        if (btnId === 'start_attempt')    return !state.running || !state.calibrated || state.attempt_active || state.complete;
                        return false;
                    },
                    renderStatus(state) {
                        const lines = [`Attempts: ${state.attempts.length}/${state.attempts_required}`];
                        if (!state.baseline_captured) lines.push('Reach up tall and tap CAPTURE BASELINE');
                        else if (!state.calibrated) lines.push('Enter your standing reach below');
                        else if (state.attempt_active) lines.push(`Jumping... live: ${state.current_jump_cm} cm`);
                        else if (state.complete) lines.push('All attempts complete — tap STOP / SAVE');
                        else lines.push('Tap START ATTEMPT, then jump');
                        if (state.best_jump_cm !== null) lines.push(`Best: ${state.best_jump_cm} cm`);
                        return lines;
                    },
                    // TODO: confirm exact Laravel field name with integration owner
                    syncFields(state) {
                        return state.best_jump_cm !== null ? { jump_cm: state.best_jump_cm } : null;
                    },
                },
                shuttle_run: {
                    dualFeed: true,
                    feedUrl:   '/api/shuttle_run/feed_a',
                    feedUrlB:  '/api/shuttle_run/feed_b',
                    stateUrl:  '/api/shuttle_run/state',
                    actionUrl: '/api/shuttle_run/action',
                    clickCalibrate: true,
                    buttons: [
                        { id: 'manual_start', label: 'MANUAL START', action: 'manual_start', color: 'bg-sky-600' },
                        { id: 'calib_reset_a', label: 'RECALIB A',   action: 'calib_reset', value: {cam:'a'}, color: 'bg-orange-600' },
                        { id: 'calib_reset_b', label: 'RECALIB B',   action: 'calib_reset', value: {cam:'b'}, color: 'bg-orange-600' },
                        { id: 'reset',        label: 'RESET',       action: 'reset',       color: 'bg-rose-600' },
                    ],
                    showCalibOverlay(state) { return false; },
                    buttonDisabled(btnId, state) {
                        if (btnId === 'manual_start') return !state.running || state.phase !== 'waiting_whistle';
                        return !state.running;
                    },
                    renderStatus(state) {
                        const lines = [];
                        if (state.phase === 'calibrating') {
                            lines.push(`Tap ${5} points on each feed: 4 lane lines + touch line (2 clicks)`);
                            lines.push(`Cam A: ${state.calibrated_a ? 'done' : 'calibrating…'}  •  Cam B: ${state.calibrated_b ? 'done' : 'calibrating…'}`);
                        } else if (state.phase === 'waiting_whistle') {
                            lines.push('Waiting for whistle — or tap MANUAL START');
                        } else {
                            lines.push('Running…');
                            Object.entries(state.lanes || {}).forEach(([lane, l]) =>
                                lines.push(`Lane ${lane}: ${l.touches} touches${l.finished ? ' — done' : ''}`));
                        }
                        return lines;
                    },
                    // Multi-lane test: sync every lane that has finished so far,
                    // same "best available on STOP" behavior as the single-value
                    // engines above (wingspan/bmi/etc). Laravel gets one row per
                    // lane instead of a single scalar.
                    syncFields(state) {
                        const lanes = state.lanes || {};
                        const finished = Object.entries(lanes).filter(([, l]) => l.finished);
                        if (!finished.length) return null;
                        return { lanes: Object.fromEntries(finished.map(([lane, l]) => [lane, l.touches])) };
                    },
                },
                dash_50m: {
                    dualFeed: true,
                    feedUrl:   '/api/dash_50m/feed_a',
                    feedUrlB:  '/api/dash_50m/feed_b',
                    stateUrl:  '/api/dash_50m/state',
                    actionUrl: '/api/dash_50m/action',
                    clickCalibrate: true,
                    buttons: [
                        { id: 'manual_start', label: 'MANUAL START', action: 'manual_start', color: 'bg-sky-600' },
                        { id: 'calib_reset',  label: 'RECALIBRATE',  action: 'calib_reset',  color: 'bg-orange-600' },
                        { id: 'reset',        label: 'RESET',        action: 'reset',        color: 'bg-rose-600' },
                    ],
                    showCalibOverlay(state) { return false; },
                    buttonDisabled(btnId, state) {
                        if (btnId === 'manual_start') return !state.running || state.phase !== 'waiting_whistle';
                        return !state.running;
                    },
                    renderStatus(state) {
                        const lines = [];
                        if (state.phase === 'calibrating') lines.push('Tap the 2 edges of the finish strip on Cam A');
                        else if (state.phase === 'waiting_whistle') lines.push('Waiting for whistle — or tap MANUAL START');
                        else {
                            lines.push('Running…');
                            Object.entries(state.lane_times || {}).forEach(([lane, t]) =>
                                lines.push(`Lane ${lane}: ${t !== null ? t.toFixed(2) + 's' : '—'}`));
                        }
                        return lines;
                    },
                    // Same multi-lane pattern as shuttle_run — sync every lane
                    // that has a finish time recorded so far.
                    // TODO: confirm exact Laravel field name/shape with integration owner
                    syncFields(state) {
                        const times = Object.entries(state.lane_times || {}).filter(([, t]) => t !== null);
                        if (!times.length) return null;
                        return { lanes: Object.fromEntries(times) };
                    },
                },
                run_600m: {
                    dualFeed: false,
                    feedUrl:   '/api/run_600m/feed_a',
                    stateUrl:  '/api/run_600m/state',
                    actionUrl: '/api/run_600m/action',
                    browserCamera: true,
                    frameUrl:  '/api/run_600m/frame',
                    buttons: [
                        { id: 'space', label: 'START / STOP', action: 'space', color: 'bg-sky-600' },
                    ],
                    showCalibOverlay(state) { return false; },
                    buttonDisabled(btnId, state) { return !state.running; },
                    renderStatus(state) {
                        const lines = [state.started ? `Running — ${state.elapsed_sec}s` : 'Stopped'];
                        Object.values(state.lap_counts || {}).forEach(l =>
                            lines.push(`${l.color}: ${l.time_sec}s`));
                        return lines;
                    },
                    // TODO: confirm exact Laravel field name/shape with integration owner
                    syncFields(state) {
                        const laps = state.lap_counts || {};
                        if (!Object.keys(laps).length) return null;
                        return { lanes: laps };
                    },
                },
            };

            const engineCfg = LIVE_ENGINES[testId] || null;
            let feedPollTimer = null;
            let latestState = null;

            function buildActionRow() {
                if (!engineCfg) return;
                const row = document.getElementById('ai-action-row');
                row.className = `hidden grid grid-cols-${engineCfg.buttons.length} gap-2`;
                row.innerHTML = engineCfg.buttons.map(b =>
                    `<button id="ai-btn-${b.id}" onclick="aiAction('${b.action}'${b.value !== undefined ? ', ' + b.value : ''})" disabled
                             class="${b.color} disabled:opacity-30 text-white text-xs font-bold py-2 rounded-lg">${b.label}</button>`
                ).join('');
                const prompt = document.getElementById('ai-calib-prompt');
                const input  = document.getElementById('ai-calib-input');
                if (prompt) prompt.innerText = engineCfg.calibPrompt;
                if (input)  input.placeholder = engineCfg.calibPlaceholder;
            }

            function setButtonsEnabled(state) {
                if (!engineCfg) return;
                engineCfg.buttons.forEach(b => {
                    const el = document.getElementById(`ai-btn-${b.id}`);
                    if (el) el.disabled = engineCfg.buttonDisabled(b.id, state);
                });
            }

            function renderState(state) {
                if (!engineCfg) return;
                const box = document.getElementById('ai-status');
                const row = document.getElementById('ai-action-row');
                if (!box) return;
                if (!state.running) {
                    // Don't just hide the box — if the background capture thread
                    // crashed, state.error has the real reason. Losing this was
                    // the cause of "feed goes blank / 409 in console with zero
                    // explanation" reports: the engine died and the UI hid the
                    // one place the reason was visible.
                    if (state.error) {
                        box.classList.remove('hidden');
                        box.innerText = `Test stopped unexpectedly: ${state.error}`;
                        row.classList.add('hidden');
                        stopFeed_keepError();
                    } else {
                        box.classList.add('hidden');
                    }
                    setButtonsEnabled(state);
                    return;
                }
                row.classList.remove('hidden');
                box.classList.remove('hidden');
                box.innerText = engineCfg.renderStatus(state).join('  •  ');
                document.getElementById('ai-calib-overlay')?.classList.toggle('hidden', !engineCfg.showCalibOverlay(state));
                setButtonsEnabled(state);
            }

            // Like stopFeed(), but leaves the (just-set) error message in
            // #ai-status visible instead of hiding it, and resets the START
            // button so the coach can try again without reloading the page.
            function stopFeed_keepError() {
                if (feedPollTimer) clearInterval(feedPollTimer);
                stopBrowserCamera();
                const img = document.getElementById('ai-feed');
                const imgB = document.getElementById('ai-feed-b');
                if (img) { img.src = ''; img.classList.add('hidden'); }
                if (imgB) { imgB.src = ''; imgB.classList.add('hidden'); }
                document.getElementById('ai-feed-placeholder')?.classList.remove('hidden');
                document.getElementById('ai-calib-overlay')?.classList.add('hidden');
                const btn = document.getElementById('engine-btn');
                if (btn) { btn.disabled = false; btn.innerText = 'START'; btn.classList.replace('bg-emerald-800', 'bg-emerald-500'); }
                runActive = false;
            }

            async function pollState() {
                if (!engineCfg) return;
                try {
                    const r = await fetch(engineCfg.stateUrl);
                    const state = await r.json();
                    latestState = state;
                    renderState(state);
                } catch (e) {}
            }

            // ── Browser camera → server (engines with browserCamera:true) ──
            // Captures this device's camera with getUserMedia and POSTs JPEG
            // frames to the engine, which processes them and streams the
            // annotated result back on feedUrl. Replaces the server opening
            // its own webcam (cv2.VideoCapture(0)), which can't work on a
            // hosted server with no camera.
            let camStream = null;
            let camTimer  = null;
            let camSending = false;
            const CAM_FPS = 12;

            async function startBrowserCamera() {
                if (!engineCfg || !engineCfg.browserCamera) return { ok: true };
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    return { ok: false, error: 'This browser blocks camera access (needs HTTPS + a modern browser).' };
                }
                const video  = document.getElementById('cam-src');
                const canvas = document.getElementById('cam-grab');
                try {
                    camStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false,
                    });
                } catch (err) {
                    const name = (err && err.name) ? err.name : String(err);
                    return { ok: false, error: `Camera access failed (${name}). Allow camera permission, and make sure the page is served over HTTPS.` };
                }
                video.srcObject = camStream;
                try { await video.play(); } catch (e) {}
                const ctx = canvas.getContext('2d');
                camTimer = setInterval(() => {
                    if (camSending || !video.videoWidth) return;
                    canvas.width  = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob((blob) => {
                        if (!blob || !engineCfg) return;
                        camSending = true;
                        fetch(engineCfg.frameUrl, { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob })
                            .catch(() => {})
                            .finally(() => { camSending = false; });
                    }, 'image/jpeg', 0.6);
                }, Math.round(1000 / CAM_FPS));
                return { ok: true };
            }

            function stopBrowserCamera() {
                if (camTimer) { clearInterval(camTimer); camTimer = null; }
                if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
                const video = document.getElementById('cam-src');
                if (video) video.srcObject = null;
                camSending = false;
            }

            function startFeed() {
                if (!engineCfg) return;
                document.getElementById('ai-feed-placeholder')?.classList.add('hidden');
                const img = document.getElementById('ai-feed');
                const imgB = document.getElementById('ai-feed-b');
                if (img) {
                    img.classList.remove('hidden');
                    img.classList.toggle('w-1/2', !!engineCfg.dualFeed);
                    img.classList.toggle('w-full', !engineCfg.dualFeed);
                    img.src = `${engineCfg.feedUrl}?t=${Date.now()}`;
                }
                if (imgB) {
                    if (engineCfg.dualFeed && engineCfg.feedUrlB) {
                        imgB.classList.remove('hidden');
                        imgB.src = `${engineCfg.feedUrlB}?t=${Date.now()}`;
                    } else {
                        imgB.classList.add('hidden');
                        imgB.src = '';
                    }
                }
                feedPollTimer = setInterval(pollState, 600);
                pollState();
            }

            function stopFeed() {
                if (feedPollTimer) clearInterval(feedPollTimer);
                stopBrowserCamera();
                const img = document.getElementById('ai-feed');
                const imgB = document.getElementById('ai-feed-b');
                if (img) { img.src = ''; img.classList.add('hidden'); }
                if (imgB) { imgB.src = ''; imgB.classList.add('hidden'); }
                document.getElementById('ai-feed-placeholder')?.classList.remove('hidden');
                document.getElementById('ai-calib-overlay')?.classList.add('hidden');
                document.getElementById('ai-status')?.classList.add('hidden');
                document.getElementById('ai-action-row')?.classList.add('hidden');
            }

            async function aiAction(action, value) {
                if (!engineCfg) return;
                const res = await fetch(engineCfg.actionUrl, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, value })
                });
                const data = await res.json();
                const box = document.getElementById('ai-status');
                if (!data.ok && data.error && box) { box.innerText = data.error; box.classList.remove('hidden'); }
                pollState();
            }

            // Click-to-calibrate for shuttle_run/dash_50m/run_600m: coach taps
            // points directly on the MJPEG <img>, translated into the same
            // frame pixel coords the engine's OpenCV loop expects.
            function onFeedClick(evt, cam) {
                if (!engineCfg || !engineCfg.clickCalibrate || !runActive) return;
                const img = evt.currentTarget;
                const rect = img.getBoundingClientRect();
                const scaleX = img.naturalWidth / rect.width;
                const scaleY = img.naturalHeight / rect.height;
                const x = Math.round((evt.clientX - rect.left) * scaleX);
                const y = Math.round((evt.clientY - rect.top) * scaleY);
                aiAction('calib_click', { cam, x, y });
            }

            function aiConfirmCm() {
                if (!engineCfg) return;
                const v = parseFloat(document.getElementById('ai-calib-input').value);
                if (!v || v <= 0) return;
                aiAction(engineCfg.calibAction, v);
                document.getElementById('ai-calib-input').value = '';
            }

            async function launchEngine() {
                const btn = document.getElementById('engine-btn');
                btn.disabled = true; btn.innerText = '…';
                const body = {};
                {% for param in test.params %}
                body[{{ param.name|tojson }}] = urlParams.get({{ param.name|tojson }});
                {% endfor %}
                if (sessionId) body['session_id'] = sessionId;
                const res = await fetch(`/api/launch/${testId}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.ok) {
                    btn.innerText = '● RUNNING';
                    btn.classList.replace('bg-emerald-500', 'bg-emerald-800');
                    runActive = true; engineStart = Date.now();
                    if (engineCfg) {
                        startFeed();
                        // Start this device's camera and begin pushing frames.
                        // If the user denies permission (or no HTTPS), tear the
                        // just-launched engine back down and surface why.
                        const cam = await startBrowserCamera();
                        if (!cam.ok) {
                            runActive = false;
                            stopFeed();
                            try { await fetch(`/api/stop/${testId}`, { method: 'POST' }); } catch (e) {}
                            const box = document.getElementById('ai-status');
                            if (box) { box.classList.remove('hidden'); box.innerText = cam.error; }
                            btn.disabled = false; btn.innerText = 'START';
                            btn.classList.replace('bg-emerald-800', 'bg-emerald-500');
                        }
                    }
                } else {
                    btn.disabled = false; btn.innerText = 'START';
                    const box = document.getElementById('ai-status');
                    if (box) { box.innerText = data.error; box.classList.remove('hidden'); }
                }
            }

            async function saveAndExit() {
                if (runActive) { runActive = false; }
                if (engineCfg) stopFeed();
                await fetch(`/api/stop/${testId}`, { method: 'POST' });
                const timeRaw = engineStart ? ((Date.now() - engineStart) / 1000) : 0;
                const min  = Math.floor(timeRaw / 60).toString().padStart(2, '0');
                const sec  = Math.floor(timeRaw % 60).toString().padStart(2, '0');
                const msec = Math.floor((timeRaw % 1) * 100).toString().padStart(2, '0');
                const sidParam = sessionId ? `&session_id=${sessionId}` : '';
                window.location.href = `/screen3?test=${encodeURIComponent(testId)}&returnMin=${min}&returnSec=${sec}&returnMsec=${msec}${sidParam}`;
            }

            // STOP/SAVE dispatch: a test with `directSync` in its config (currently
            // just wingspan) bypasses screen3 and posts straight back to the
            // Laravel parent window; everything else runs the normal screen3
            // review/save flow via saveAndExit().
            async function handleStopClick() {
                // 1. Always stop the engine/camera process first. The stop
                //    endpoint also stages the best reading server-side, so the
                //    final value is guaranteed to be in the engine state after
                //    this returns.
                if (runActive) { runActive = false; }
                if (engineCfg) stopFeed();
                try { await fetch(`/api/stop/${testId}`, { method: 'POST' }); }
                catch (e) { console.error('Stop system error:', e); }

                // 2. Re-read state AFTER stopping so we sync the final saved
                //    value (last_save / staged result) rather than a stale
                //    600ms-old poll — the old code synced whatever snap_final_cm
                //    happened to be, which is null once a reading is saved.
                if (engineCfg && engineCfg.stateUrl) {
                    try {
                        const fresh = await fetch(engineCfg.stateUrl).then(r => r.json());
                        if (fresh) latestState = fresh;
                    } catch (e) {}
                }

                // 3. Build the Laravel payload from the freshest state.
                const fields = (engineCfg && engineCfg.syncFields && latestState)
                    ? engineCfg.syncFields(latestState)
                    : null;

                // 3. Sync to Laravel — only works when this page was opened as a
                //    popup/child window by Laravel (window.opener set).
                //    Laravel (Bhawani's confirmed screen3 contract) keys off
                //    `exerciseType` (e.g. 'Wingspan'), NOT our internal testId —
                //    sending only testId was why the parent ignored this sync.
                const EXERCISE_TYPE = {
                    wingspan:'Wingspan', bmi:'BMI', curl_up:'CurlUp',
                    wall_toss:'WallToss', sit_reach:'SitReach',
                    vertical_jump:'VerticalJump', shuttle_run:'ShuttleRun',
                    dash_50m:'Dash50m', run_600m:'Run600m',
                };
                if (fields && window.opener) {
                    window.opener.postMessage({
                        type: 'AI_SYNC_DATA',
                        exerciseType: EXERCISE_TYPE[testId] || testId,
                        testId,
                        sessionId,
                        ...fields,
                    }, 'https://nep.goforfit.in');
                } else if (fields && !window.opener) {
                    console.warn('No window.opener — page not opened by Laravel, skipping sync.');
                } else if (!fields) {
                    console.warn(`No result available yet for '${testId}' — skipping Laravel sync.`);
                }

                // 4. Review flow stays for every test: local DB save (backup)
                //    still happens via the normal screen3 review screen.
                saveAndExit();
            }

            if (engineCfg) buildActionRow();
    </script>
  </body>
